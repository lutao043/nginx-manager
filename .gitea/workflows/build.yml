# Gitea Actions — Windows 打包（单平台）
# 触发：push tag（格式 v*.*.*）→ 打包并建 Release；workflow_dispatch → 只打包试跑
#
# 平台决策（2026-09-24，用户确认）：本实例 runner 为 win-runner（windows-latest）与
#   wsl-runner（ubuntu-latest），当前只需要 Windows 产物，故移除 macOS 构建任务。
#   Release 仅在 tag 推送时创建，手动试跑不会污染 Release 页。
#
# 产物：dist/nginx-manager-v{版本}.exe，Artifact 名 nginx-manager-windows

name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyinstaller
      - run: python build.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-manager-windows
          path: dist/nginx-manager-v*.exe

  # 仅 tag 推送发布；workflow_dispatch 试跑时本任务跳过
  release:
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 生成发布说明需要完整历史与 tag
      - uses: actions/download-artifact@v4
        with:
          name: nginx-manager-windows
          path: ./windows
      - name: Prepare release notes
        run: |
          TAG="${{ github.ref_name }}"
          if [ -f "release-notes/$TAG.md" ]; then
            # 优先使用仓库内维护的版本说明（release-notes/<tag>.md）
            cp "release-notes/$TAG.md" RELEASE_NOTES.md
          else
            # 缺说明文件时回退：由提交记录生成（剔除 release: 提交）
            PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              git log "$PREV..$TAG" --no-merges --pretty=format:'- %s' | grep -v '^- release: ' > RELEASE_NOTES.md || true
            else
              git log "$TAG" --no-merges --pretty=format:'- %s' > RELEASE_NOTES.md
            fi
          fi
          [ -s RELEASE_NOTES.md ] || echo "见提交记录" > RELEASE_NOTES.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: windows/nginx-manager-v*.exe
          body_path: RELEASE_NOTES.md
