# Gitea Actions — Windows 打包与发布（与 .github 侧同语义）
# 触发：push tag（格式 v*.*.*）→ 打包并建/更新 Gitea Release（挂上 exe）；
#      手动 workflow_dispatch → 只打包试跑，不发布
#
# 为什么不用 actions/checkout | setup-python | upload-artifact：
#   win-runner 以「宿主模式」运行（Windows 上无 Docker），而该主机上没有 Node.js，
#   所有 JS action 在任务准备阶段即失败：`Cannot find: node in PATH`（2026-09-24
#   实测，见 run #25 的 build-windows 日志）。同一主机上 Python 也未安装（只有
#   Microsoft Store 的占位别名），git 2.55、curl、PowerShell 5.1 在位。
#   故本工作流只用宿主已有的 git / curl / cmd / PowerShell：
#   取源码用 git（私有仓库带临时 token），Python 用 python.org 官方安装包静默装到
#   用户目录（不改系统 PATH、不要管理员、不建快捷方式），产物复制到固定目录并打印 SHA-256；
#   发布用 Gitea 自己的 REST API（curl 传 JSON 与 multipart，PowerShell 5.1 只做 JSON 解析/生成）。
#
# 若要改回标准 action 写法：先在 runner 主机安装 Node.js LTS（winget install
#   OpenJS.NodeJS.LTS）并重启 runner 服务，再恢复 actions/checkout 等步骤。
#
# ⚠ 本文件所有 run: 脚本必须保持纯 ASCII：runner 把脚本章节按 UTF-8 落盘，而 cmd 按
#   本地代码页（cp936）解析、PowerShell 5.1 按 ANSI 读无 BOM 脚本，中文字节会吃掉后续
#   字符（实测报错碎片 `'OKEN' not ...`、token 被当成命令执行），整段脚本解析崩坏。
#   中文说明一律写在 YAML 注释里；发布说明正文从 release-notes/*.md 按 UTF-8 读入。
#
# 产物：%USERPROFILE%\nginx-manager-build\dist\nginx-manager-v{版本}.exe
# 发布：Gitea Release（tag 推送时创建或更新，资产与发布说明同 GitHub 侧）

name: Build Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      force_python_reinstall:
        description: "Force re-download/reinstall Python (default: reuse installed interpreter)"
        default: "false"
      release_tag:
        description: "Publish a Gitea release for this existing tag (e.g. v1.0.0); empty means build only"
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # 1) 取源码：固定目录、每次全新克隆，避免残留状态
      #    release_tag 输入用于补发已有 tag：手动 dispatch 时按该 tag 取源码（tag 推送时
      #    不需要，GITHUB_SHA 就是 tag 指向的提交）。
      - name: Checkout (git)
        shell: cmd
        run: |
          @echo off
          set BUILD_ROOT=%USERPROFILE%\nginx-manager-build
          set SRC=%BUILD_ROOT%\src
          set BUILD_REF=${{ inputs.release_tag }}
          if "%BUILD_REF%"=="" set BUILD_REF=%GITHUB_SHA%
          set TOKEN=${{ secrets.GITHUB_TOKEN }}
          if "%TOKEN%"=="" set TOKEN=%GITHUB_TOKEN%
          if "%TOKEN%"=="" (
            echo [git] ERROR: no GITHUB_TOKEN available, cannot clone private repo
            exit /b 1
          )
          if not exist "%BUILD_ROOT%" mkdir "%BUILD_ROOT%"
          if exist "%SRC%\.git" rmdir /s /q "%SRC%"
          set HOST=%GITHUB_SERVER_URL:http://=%
          git clone --quiet "http://lutao:%TOKEN%@%HOST%/%GITHUB_REPOSITORY%.git" "%SRC%"
          if errorlevel 1 exit /b 1
          cd /d "%SRC%"
          if errorlevel 1 exit /b 1
          git checkout --force --quiet %BUILD_REF%
          if errorlevel 1 exit /b 1
          git log -1 --oneline
          git describe --tags --exact-match
          if errorlevel 1 echo [git] not a tag build (manual run)
          exit /b 0

      # 2) Python 3.13（含 tcl/tk：界面与 PyInstaller 都依赖）：装到用户目录，仅首次下载安装
      #    安装包按国内镜像优先的顺序取（python.org 直连实测约 30KB/s，27.5MB 要十几分钟）
      #    自愈：解释器必须真的能跑出 PYOK 才复用；缺 DLL 的解释器会「静默成功」
      #    （加载器报错不进进程输出、退出码是负数，if errorlevel 判不出来），故用 findstr 校验。
      - name: Prepare Python
        shell: cmd
        run: |
          @echo off
          set BUILD_ROOT=%USERPROFILE%\nginx-manager-build
          set PY_ROOT=%BUILD_ROOT%\python313
          set PROBE=%BUILD_ROOT%\pyprobe.txt
          set BUNDLE=%BUILD_ROOT%\py-installer.exe
          set PY_VER=3.13.7
          set FORCE_REINSTALL=${{ inputs.force_python_reinstall }}
          if not exist "%BUILD_ROOT%" mkdir "%BUILD_ROOT%"
          if "%FORCE_REINSTALL%"=="true" goto :install
          if not exist "%PY_ROOT%\python.exe" goto :install
          "%PY_ROOT%\python.exe" -c "print('PYOK')" >"%PROBE%" 2>&1
          findstr /x /c:"PYOK" "%PROBE%" >nul 2>&1
          if not errorlevel 1 goto :havepy
          echo [py] interpreter present but not runnable, reinstalling
          :install
          echo [py] fetching python %PY_VER% installer ...
          for %%U in ("https://mirrors.ustc.edu.cn/python/%PY_VER%/python-%PY_VER%-amd64.exe" "https://mirrors.huaweicloud.com/python/%PY_VER%/python-%PY_VER%-amd64.exe" "https://registry.npmmirror.com/-/binary/python/%PY_VER%/python-%PY_VER%-amd64.exe" "https://www.python.org/ftp/python/%PY_VER%/python-%PY_VER%-amd64.exe") do (
            if exist "%BUNDLE%" del /q "%BUNDLE%"
            echo [py] trying %%U
            curl -L --fail --connect-timeout 15 --max-time 600 -o "%BUNDLE%" %%U
            if not errorlevel 1 goto :downloaded
          )
          echo [py] ERROR: all mirrors failed
          exit /b 1
          :downloaded
          if exist "%PY_ROOT%" rmdir /s /q "%PY_ROOT%"
          echo [py] installing to %PY_ROOT% ...
          "%BUNDLE%" /quiet InstallAllUsers=0 TargetDir="%PY_ROOT%" Include_tcltk=1 Include_pip=1 Include_launcher=0 PrependPath=0 AssociateFiles=0 Shortcuts=0 Include_test=0 Include_doc=0 Include_dev=0
          echo [py] installer exit=%errorlevel%
          if not exist "%PY_ROOT%\python.exe" (
            echo [py] no python.exe after install: stale MSI registration, retrying with /repair
            "%BUNDLE%" /quiet /repair InstallAllUsers=0
          )
          "%PY_ROOT%\python.exe" -c "print('PYOK')" >"%PROBE%" 2>&1
          findstr /x /c:"PYOK" "%PROBE%" >nul 2>&1
          if errorlevel 1 (
            echo [py] ERROR: interpreter not runnable after install and repair
            exit /b 1
          )
          :havepy
          "%PY_ROOT%\python.exe" --version
          if errorlevel 1 exit /b 1
          "%PY_ROOT%\python.exe" -c "import tkinter;print('[py] tkinter', tkinter.TkVersion)"
          if errorlevel 1 exit /b 1
          "%PY_ROOT%\python.exe" -m pip --version
          if errorlevel 1 (
            echo [py] pip missing, bootstrapping with ensurepip
            "%PY_ROOT%\python.exe" -m ensurepip --upgrade
            "%PY_ROOT%\python.exe" -m pip --version
          )
          if errorlevel 1 (
            echo [py] ERROR: pip unavailable
            exit /b 1
          )
          exit /b 0

      # 3) 打包：build.py 自动生成 version_info.py 并调 PyInstaller（版本号取自 backend/server.py）
      #    PyInstaller 先走清华镜像（快），失败再退回官方源
      - name: Build exe (PyInstaller)
        shell: cmd
        run: |
          @echo off
          set BUILD_ROOT=%USERPROFILE%\nginx-manager-build
          set PY_ROOT=%BUILD_ROOT%\python313
          cd /d "%BUILD_ROOT%\src"
          if errorlevel 1 exit /b 1
          "%PY_ROOT%\python.exe" -m pip install --quiet --disable-pip-version-check --retries 5 --timeout 60 -i https://pypi.tuna.tsinghua.edu.cn/simple pyinstaller
          if errorlevel 1 (
            echo [build] mirror index failed, retry on official pypi
            "%PY_ROOT%\python.exe" -m pip install --quiet --disable-pip-version-check --retries 5 --timeout 60 pyinstaller
          )
          if errorlevel 1 exit /b 1
          "%PY_ROOT%\python.exe" build.py
          if errorlevel 1 exit /b 1
          exit /b 0

      # 4) 产物落固定目录并打印大小与 SHA-256（exe 留在 runner 主机，便于直接取用）
      - name: Collect artifact
        shell: cmd
        run: |
          @echo off
          set BUILD_ROOT=%USERPROFILE%\nginx-manager-build
          set DEST=%BUILD_ROOT%\dist
          if not exist "%DEST%" mkdir "%DEST%"
          copy /y "%BUILD_ROOT%\src\dist\nginx-manager-v*.exe" "%DEST%\" >nul
          if errorlevel 1 (
            echo [out] ERROR: no exe produced
            exit /b 1
          )
          for %%F in ("%DEST%\nginx-manager-v*.exe") do (
            echo [out] file: %%F
            echo [out] size: %%~zF bytes
            certutil -hashfile "%%F" SHA256
          )
          exit /b 0

  # 5) 发布：建或更新 Gitea Release 并挂上 exe（与 .github 侧同语义）。
  #    tag 推送时自动发布；手动 dispatch 带 release_tag 输入时补发该已有 tag（旧 tag 的提交
  #    里没有本工作流的新版语义，只能用当前 main 上的本文件补发）；两者都没有则直接跳过。
  #    幂等：同一 tag 重跑（rerun / 重推 tag）会更新说明并覆盖同名资产。
  #    发布说明优先取 release-notes/<tag>.md（按 UTF-8 读入），缺失时由提交记录生成并附
  #    compare 链接；预发布号（tag 含 -）标记 prerelease。全部 HTTP 走 curl，PowerShell 只做 JSON 读写。
  #    git 输出必须用 .NET Process 以 UTF-8 读取：PS 5.1 解码原生命令输出走
  #    [Console]::OutputEncoding（中文 Windows 默认 cp936），在本宿主（stdout 被重定向、
  #    无控制台）把它设成 UTF-8 是静默无效的——实测发布说明仍按 cp936 解成乱码。
  release:
    needs: [build-windows]
    runs-on: windows-latest
    steps:
      - name: Publish Gitea Release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-GitText([string]$workDir, [string[]]$gitArgs) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = 'git'
            $psi.Arguments = (($gitArgs | ForEach-Object { if ($_ -match '\s') { '"' + $_ + '"' } else { $_ } }) -join ' ')
            $psi.WorkingDirectory = $workDir
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.StandardOutputEncoding = [System.Text.Encoding]::UTF8
            $p = [System.Diagnostics.Process]::Start($psi)
            $out = $p.StandardOutput.ReadToEnd()
            $p.WaitForExit()
            return $out
          }

          $tag = $env:REL_TAG
          if (-not $tag) {
            if (-not $env:GITHUB_REF.StartsWith('refs/tags/')) {
              Write-Host '[rel] skip: manual run without release_tag input'
              exit 0
            }
            $tag = $env:GITHUB_REF_NAME
          }

          $root   = Join-Path $env:USERPROFILE 'nginx-manager-build'
          $src    = Join-Path $root 'src'
          $dist   = Join-Path $root 'dist'
          $repo   = $env:GITHUB_REPOSITORY
          $api    = "$($env:GITHUB_SERVER_URL)/api/v1/repos/$repo"
          $auth   = "Authorization: token $($env:GH_TOKEN)"
          $tmp    = Join-Path $env:TEMP 'relapi'
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          New-Item -ItemType Directory -Path $tmp | Out-Null
          Write-Host "[rel] tag=$tag repo=$repo"

          $exeName = "nginx-manager-$tag.exe"
          $exe = Get-ChildItem (Join-Path $dist $exeName) -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem (Join-Path $dist 'nginx-manager-v*.exe') | Select-Object -First 1
            if (-not $exe) { throw "[rel] ERROR: no exe found in $dist" }
            Write-Host "[rel] warn: $exeName not found, using $($exe.Name)"
          }
          Write-Host "[rel] asset=$($exe.Name) size=$($exe.Length)"

          # release notes: repo notes file first, else generated from the commit log
          $notesPath = Join-Path $src "release-notes\$tag.md"
          if (Test-Path $notesPath) {
            $notes = Get-Content -Raw -Encoding UTF8 $notesPath
            Write-Host "[rel] notes from release-notes/$tag.md"
          } else {
            $prevText = Get-GitText $src @('describe','--tags','--abbrev=0',"$tag^")
            $prev = ($prevText -split "`r?`n" | Where-Object { $_ } | Select-Object -First 1)
            if ($prev) {
              $logText = Get-GitText $src @('log',"$prev..$tag",'--no-merges','--pretty=format:- %s')
              $lines = ($logText -split "`r?`n") | Where-Object { $_ -and ($_ -notlike '- release: *') }
              $notes = ($lines -join "`n") + "`n`n**Full Changelog**: $($env:GITHUB_SERVER_URL)/$repo/compare/$prev...$tag"
            } else {
              $logText = Get-GitText $src @('log',$tag,'--no-merges','--pretty=format:- %s')
              $notes = (($logText -split "`r?`n") | Where-Object { $_ }) -join "`n"
            }
            Write-Host "[rel] notes generated from commit log (prev=$prev)"
          }
          if (-not $notes) { $notes = 'see commit log' }

          $isPre = $tag.Contains('-')
          $payload = @{ tag_name = $tag; name = "nginx-manager $tag"; body = $notes; draft = $false; prerelease = $isPre } | ConvertTo-Json -Depth 4
          $payloadFile = Join-Path $tmp 'payload.json'
          [System.IO.File]::WriteAllText($payloadFile, $payload, (New-Object System.Text.UTF8Encoding($false)))

          # create or update the release
          $respFile = Join-Path $tmp 'resp.json'
          $code = & curl.exe -s -o $respFile -w '%{http_code}' -H $auth "$api/releases/tags/$tag"
          $code = "$code".Trim()
          if ($code -eq '200') {
            $relId = (Get-Content -Raw -Encoding UTF8 $respFile | ConvertFrom-Json).id
            $code2 = & curl.exe -s -o $respFile -w '%{http_code}' -X PATCH -H $auth -H 'Content-Type: application/json' --data-binary "@$payloadFile" "$api/releases/$relId"
            $code2 = "$code2".Trim()
            if ($code2 -ne '200') { throw "[rel] ERROR: update release failed http=$code2" }
            Write-Host "[rel] release updated id=$relId"
          } else {
            $code2 = & curl.exe -s -o $respFile -w '%{http_code}' -X POST -H $auth -H 'Content-Type: application/json' --data-binary "@$payloadFile" "$api/releases"
            $code2 = "$code2".Trim()
            if ($code2 -ne '201') {
              Write-Host (Get-Content -Raw -Encoding UTF8 $respFile)
              throw "[rel] ERROR: create release failed http=$code2"
            }
            $rel = Get-Content -Raw -Encoding UTF8 $respFile | ConvertFrom-Json
            $relId = $rel.id
            Write-Host "[rel] release created id=$relId url=$($rel.html_url)"
          }

          # drop a same-name asset first so re-runs replace instead of failing
          $assetsFile = Join-Path $tmp 'assets.json'
          & curl.exe -s -o $assetsFile -H $auth "$api/releases/$relId/assets" | Out-Null
          $assets = @(Get-Content -Raw -Encoding UTF8 $assetsFile | ConvertFrom-Json)
          foreach ($a in $assets) {
            if ($a.name -eq $exe.Name) {
              Write-Host "[rel] removing existing asset id=$($a.id)"
              & curl.exe -s -o $null -X DELETE -H $auth "$api/releases/$relId/assets/$($a.id)" | Out-Null
            }
          }

          # upload the exe
          $upFile = Join-Path $tmp 'upload.json'
          $code3 = & curl.exe -s -o $upFile -w '%{http_code}' -X POST -H $auth -F "attachment=@$($exe.FullName)" "$api/releases/$relId/assets?name=$($exe.Name)"
          $code3 = "$code3".Trim()
          if ($code3 -ne '201') {
            Write-Host (Get-Content -Raw -Encoding UTF8 $upFile)
            throw "[rel] ERROR: asset upload failed http=$code3"
          }
          $up = Get-Content -Raw -Encoding UTF8 $upFile | ConvertFrom-Json
          Write-Host "[rel] OK: asset $($up.name) size=$($up.size) url=$($up.browser_download_url)"
          Write-Host "[rel] OK: release $tag published on Gitea"
