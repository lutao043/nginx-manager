# Gitea Actions — 自动构建多平台 Release
# 触发：push tag（格式 v*.*.*）
# 平台：macOS (arm64) + Windows (amd64)

name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyinstaller
      - run: python build.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-manager-macos
          path: dist/nginx-manager-v*  # 不带扩展名（macOS/Linux）

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyinstaller
      - run: python build.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-manager-windows
          path: dist/nginx-manager-v*.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 生成发布说明需要完整历史与 tag
      - uses: actions/download-artifact@v4
      - name: Prepare release notes
        run: |
          TAG="${{ github.ref_name }}"
          if [ -f "release-notes/$TAG.md" ]; then
            # 优先使用仓库内维护的版本说明（release-notes/<tag>.md）
            cp "release-notes/$TAG.md" RELEASE_NOTES.md
          else
            # 缺说明文件时回退：由提交记录生成（剔除 release: 提交）
            PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              git log "$PREV..$TAG" --no-merges --pretty=format:'- %s' | grep -v '^- release: ' > RELEASE_NOTES.md || true
            else
              git log "$TAG" --no-merges --pretty=format:'- %s' > RELEASE_NOTES.md
            fi
          fi
          [ -s RELEASE_NOTES.md ] || echo "见提交记录" > RELEASE_NOTES.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nginx-manager-macos/nginx-manager-v*
            nginx-manager-windows/nginx-manager-v*.exe
          body_path: RELEASE_NOTES.md
