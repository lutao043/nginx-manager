# Gitea Actions — 自动构建多平台 Release
# 触发：push tag（格式 v*.*.*）
# 平台：macOS (arm64) + Windows (amd64)

name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyinstaller
      - run: python build.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-manager-macos
          path: dist/nginx-manager

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyinstaller
      - run: python build.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-manager-windows
          path: dist/nginx-manager.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nginx-manager-macos/nginx-manager
            nginx-manager-windows/nginx-manager.exe
          generate_release_notes: true
