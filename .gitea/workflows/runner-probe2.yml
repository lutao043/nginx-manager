# 临时诊断工作流 2：定位「步骤零输出却报成功」的原因（用完即删）
# 触发：workflow_dispatch
name: Runner Probe 2 (temp)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: A echo only
        shell: cmd
        run: |
          @echo off
          echo A-OK
          exit /b 0

      - name: B labels and for loop
        shell: cmd
        run: |
          @echo off
          if exist "%USERPROFILE%\nginx-manager-build\python313\python.exe" goto :present
          echo B-python-missing
          goto :after
          :present
          echo B-python-present
          :after
          for %%U in ("one" "two") do (
            echo B-item %%U
          )
          echo B-END
          exit /b 0

      - name: C inspect build root
        shell: cmd
        run: |
          @echo off
          echo C-buildroot:
          dir /b "%USERPROFILE%\nginx-manager-build" 2>nul || echo C-buildroot-missing
          echo C-python-exe:
          if exist "%USERPROFILE%\nginx-manager-build\python313\python.exe" (echo C-python-exe-present) else (echo C-python-exe-missing)
          echo C-src:
          if exist "%USERPROFILE%\nginx-manager-build\src\.git" (echo C-src-present) else (echo C-src-missing)
          echo C-actcache:
          dir /b "%USERPROFILE%\.cache\act" 2>nul || echo C-actcache-missing
          echo C-END
          exit /b 0

      - name: D run python
        shell: cmd
        run: |
          @echo off
          "%USERPROFILE%\nginx-manager-build\python313\python.exe" --version 2>&1
          echo D-errorlevel=%errorlevel%
          echo D-END
          exit /b 0

      - name: E disk space
        shell: cmd
        run: |
          @echo off
          powershell -NoProfile -Command "Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}},@{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}} | Format-Table -AutoSize"
          echo E-END
          exit /b 0
