# Gitea Actions — 测试门禁
# 触发：任意分支推送与 PR（tag 推送交给 build.yml 发布，不在这里重复跑）
# 与 .github/workflows/tests.yml 保持一致
#
# ⚠ 本仓库所在的自建 Gitea 实例未配置 Actions runner（2026-09-22 由用户确认），
#   因此本工作流不会实际执行，不构成门禁。实际执行的测试门禁与发布流水线都在
#   GitHub Actions（.github/workflows/）。保留本文件是为了两处配置镜像一致，
#   将来该实例配上 runner 即可直接生效。

name: Tests

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # 服务以真实子进程启动、nginx 用 POSIX 替身，无需安装 nginx
      - name: Backend tests
        run: python -m pytest tests/ -q

      # 与上面等价的标准库入口（后端零第三方依赖：不装 pytest 也应能跑）
      - name: Backend tests (stdlib entry point)
        run: python -m unittest discover -s tests -t .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend syntax check
        run: |
          for f in frontend/js/*.js; do node --check "$f"; done

      # G2：JS 引用的 #id / class 必须真实存在于 index.html / style.css
      - name: DOM contract check
        run: python3 scripts/dom_contract.py
