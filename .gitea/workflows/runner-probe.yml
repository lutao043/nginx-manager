# 临时诊断工作流：探测 win-runner 主机上可用的工具链（node/git/python/pip/网络），
# 用完即删。触发：workflow_dispatch。
name: Runner Probe (temp)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Environment probe
        shell: cmd
        run: |
          @echo off
          echo === RUNNER-HOST-OS ===
          ver
          echo === USER ===
          whoami
          echo === WORKDIR ===
          cd
          echo === NODE ===
          where node 2>nul || echo NODE-NOT-IN-PATH
          node --version 2>nul || echo NODE-NO-VERSION
          if exist "C:\Program Files\nodejs\node.exe" echo NODE-AT-PROGRAMFILES
          if exist "C:\Program Files (x86)\nodejs\node.exe" echo NODE-AT-PROGRAMFILES-X86
          dir /b "C:\Program Files\nodejs" 2>nul
          echo === GIT ===
          where git 2>nul || echo GIT-NOT-IN-PATH
          git --version 2>nul || echo GIT-NO-VERSION
          if exist "C:\Program Files\Git\cmd\git.exe" echo GIT-AT-PROGRAMFILES
          echo === PYTHON ===
          where python 2>nul || echo PYTHON-NOT-IN-PATH
          python --version 2>nul || echo PYTHON-NO-VERSION
          where py 2>nul || echo PY-LAUNCHER-NOT-IN-PATH
          py -0p 2>nul || echo PY-LAUNCHER-NO-LIST
          echo === PIP ===
          python -m pip --version 2>nul || echo PIP-MISSING
          echo === TKINTER ===
          python -c "import tkinter;print('TKINTER-OK',tkinter.TkVersion)" 2>nul || echo TKINTER-MISSING
          echo === POWERSHELL ===
          where pwsh 2>nul || echo PWSH-NOT-IN-PATH
          where powershell 2>nul || echo POWERSHELL-NOT-IN-PATH
          echo === NETWORK ===
          curl -s -o nul -w "pypi.org:%%{http_code}\n" --max-time 10 https://pypi.org/simple/ 2>nul || echo PYPI-UNREACHABLE
          curl -s -o nul -w "github.com:%%{http_code}\n" --max-time 10 https://github.com 2>nul || echo GITHUB-UNREACHABLE
          echo === PATH ===
          echo %PATH%
          echo === PROBE-COMPLETE ===
