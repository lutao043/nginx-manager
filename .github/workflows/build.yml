name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyinstaller
      - run: python build.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-manager-windows
          path: dist/nginx-manager.exe

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nginx-manager-windows
          path: ./windows
      - name: Create Release and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create release with Windows exe
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "nginx-manager ${{ github.ref_name }}" \
            --generate-notes \
            ./windows/nginx-manager.exe
